; A compile-only target exercises/link-checks the otherwise unconfigured TLS
; path. Its output is not a usable firmware release. Do not flash this image.
[platformio]
default_envs = esp01s_https_build_check
[env:esp01s_https_build_check]
platform = espressif8266@4.2.1
board = esp01_1m
framework = arduino
board_build.f_cpu = 160000000L
build_flags =
    -I../Software
    -I../Hardware
    -DGATEWAY_BUILD_CHECK=1
extra_scripts = pre:shared_sources.py
