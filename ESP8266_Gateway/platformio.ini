[platformio]
default_envs = esp01s

[env:esp01s]
platform = espressif8266@4.2.1
board = esp01_1m
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
build_flags = -I../Software -I../Hardware
; Shared C protocol files are compiled directly, no duplicated codec.
extra_scripts = pre:shared_sources.py
