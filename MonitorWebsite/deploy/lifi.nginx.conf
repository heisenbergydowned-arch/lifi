# Existing VPS uses an SNI stream router on public 443 -> loopback TLS on 8444.
limit_req_zone $binary_remote_addr zone=lifi_ingest:1m rate=10r/s;
server {
    listen 80;
    listen [::]:80;
    server_name lifi.hsn811.top;
    location ^~ /.well-known/acme-challenge/ { root /var/www/lifi-acme; }
    location / { return 301 https://lifi.hsn811.top$request_uri; }
}
# App domain (Cloudflare grey cloud = DNS only, points straight at the VPS).
# Its cert is obtained via the port-80 block below; reload only after certbot succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name lifiapp.jjqpro.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/lifi-acme; }
    location / { return 301 https://lifiapp.jjqpro.com$request_uri; }
}
server {
    listen 127.0.0.1:8444 ssl http2;
    server_name lifi.hsn811.top;
    ssl_certificate /etc/letsencrypt/live/lifi.hsn811.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifi.hsn811.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LIFI_SSL:1m;
    ssl_session_timeout 10m;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=15552000" always;
    access_log /var/log/nginx/lifi.access.log;
    error_log /var/log/nginx/lifi.error.log warn;
    location / {
        limit_req zone=lifi_ingest burst=30 nodelay;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host lifi.hsn811.top;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
server {
    listen 127.0.0.1:8444 ssl http2;
    server_name lifiapp.jjqpro.com;
    ssl_certificate /etc/letsencrypt/live/lifiapp.jjqpro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifiapp.jjqpro.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LIFI_APP_SSL:1m;
    ssl_session_timeout 10m;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=15552000" always;
    access_log /var/log/nginx/lifi-app.access.log;
    error_log /var/log/nginx/lifi-app.error.log warn;
    location / {
        limit_req zone=lifi_ingest burst=30 nodelay;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host lifiapp.jjqpro.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
